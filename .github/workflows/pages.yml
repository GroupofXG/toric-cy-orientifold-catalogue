name: Publish catalogue reader
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalogue-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch versioned data and verify its digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python -c 'import json; print(json.load(open("edition.json"))["tag"])')
          gh release download "$tag" --pattern catalogue-pages-data.zip --dir "$RUNNER_TEMP"
          python prepare_pages.py "$RUNNER_TEMP/catalogue-pages-data.zip" site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
