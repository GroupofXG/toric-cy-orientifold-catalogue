<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calabi–Yau orientifold catalogue</title>
  <link href="./catalogue.css" rel="stylesheet">
  <script defer src="./zip-catalogue.js"></script>
  <script defer src="./catalogue.js"></script>
</head>
<body>
  <header><div class="wrap mast"><a class="mark" href="./">CY / Orientifolds</a><a class="guide" href="./guide.html">Field guide</a></div></header>
  <main class="wrap">
    <h1>Calabi–Yau orientifold catalogue</h1>
    <p class="intro">Explore fixed loci on favourable toric hypersurfaces by polytope, triangulation and involution.</p>
    <p class="edition" id="edition"></p>
    <section aria-labelledby="coverage"><h2 id="coverage">Available data</h2>
      <div class="scroll"><table><thead><tr><th scope="col">h<sup>1,1</sup></th><th scope="col">Polytopes</th><th scope="col">FRSTs</th><th scope="col">Involutions</th><th scope="col">Eigenfamilies</th></tr></thead><tbody id="counts"></tbody></table></div>
    </section>
    <section aria-labelledby="lookup"><h2 id="lookup">Find a record</h2>
      <form id="lookup-form">
        <label>Hodge number h<sup>1,1</sup><select id="rank" required></select></label>
        <label>Catalogue ID<input id="pid" type="text" required autocomplete="off" placeholder="e.g. P1_K0_T0_I1_Pplus"></label>
        <button type="submit">Open record</button>
      </form>
      <div id="browse"></div>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <article id="result" aria-label="Catalogue records"></article>
    <noscript>Enable JavaScript to browse records or download the JSON Lines tables from the release.</noscript>
  </main>
</body>
</html>
